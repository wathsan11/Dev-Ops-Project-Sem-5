
services:
  mongodb:
    image: mongo:6.0
    container_name: diary-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: diaryAPI
    volumes:
      - mongo-data:/data/db

  backend:
    image: ${DOCKER_HUB_USER}/diary-backend:latest
    build: ./backend
    container_name: diary-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/diaryAPI
      SPRING_DATA_MONGODB_DATABASE: diaryAPI
    depends_on:
      - mongodb

  frontend:
    image: ${DOCKER_HUB_USER}/diary-frontend:latest
    build: ./frontend
    container_name: diary-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://${EC2_PUBLIC_IP:-localhost}:8081
    depends_on:
      - backend

volumes:
  mongo-data:
